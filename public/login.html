<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar &mdash; Folha de Pagamento</title>
  <meta name="application-name" content="Folha de Pagamento">
  <meta name="theme-color" content="#08080a">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B5%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230a0a0b'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%92%B5%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">R$&rarr;$</span>
      <h1>Folha de Pagamento</h1>
      <p>Entre para continuar</p>
    </div>

    <form class="login-form" id="form-login" autocomplete="on">
      <div class="field">
        <label for="username">Usu&aacute;rio</label>
        <input class="input" id="username" name="username" autocomplete="username"
               autocapitalize="none" spellcheck="false" placeholder="seu.usuario" required autofocus>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="pw-wrap">
          <input class="input" id="password" name="password" type="password"
                 autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
          <button class="pw-toggle" type="button" data-pw-toggle="password" aria-label="Mostrar senha" tabindex="-1">&#128065;</button>
        </div>
      </div>

      <p class="caps-warn" id="caps-warn"><span>&#9650;</span> Caps Lock est&aacute; ligado</p>
      <p class="error-text" id="login-error" role="alert"></p>

      <button class="btn btn-primary btn-block btn-lg" type="submit" id="btn-entrar">Entrar</button>
    </form>

    <p class="login-foot">Acesso restrito. Fale com a CCO se precisar de uma conta.</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
